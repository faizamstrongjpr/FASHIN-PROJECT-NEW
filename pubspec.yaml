name: simple_music_player_2
description: "A new modern Flutter music player."
publish_to: 'none'
version: 2.3.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Audio
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  just_audio_windows:
  # equalizer_flutter: ^0.0.1 # Still disabled as it's truly broken

  # Metadata
  metadata_god: ^1.1.0 # Restore
  # flutter_media_metadata: 1.0.0+1 # Still disabled
  
  # Tools
  shared_preferences: ^2.3.2
  path: ^1.9.0
  file_picker: ^8.1.0 # Restore
  package_info_plus: ^8.1.0 # Restore
  
  # Parsing HTTP
  http: ^1.2.2
  html: ^0.15.4

  # UI
  glassmorphism: ^3.0.0
  google_fonts: ^6.2.1
  provider: ^6.1.2
  flutter_dotenv: ^6.0.0
  envied: ^0.5.4+1
  scrollable_positioned_list:
  palette_generator: ^0.3.3
  bitsdojo_window: ^0.1.5
  window_manager: ^0.3.9 # Kept for deskto compatibility if needed, but safe

  # Shareable Card
  screenshot: ^3.0.0 # Restore
  share_plus: ^10.1.0 # Restore
  path_provider: ^2.1.4 

  # Online Stream
  soundcloud_explode_dart: ^1.1.0
  just_audio_media_kit: ^2.1.0
  media_kit: ^1.1.10
  media_kit_libs_video: ^1.0.0

  # Youtube Parser
  permission_handler: ^11.3.1
  youtube_explode_dart: ^2.5.0
  flutter_local_notifications: ^17.2.2

  # Utilities
  uuid: ^4.5.1
  ffi: ^2.1.3

  # Databases
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  # smtc_windows: ^1.1.0 # Still disabled to focus on Android
  # windows_taskbar: ^1.1.2 # Still disabled

  # Device Info
  device_info_plus: ^11.1.0 # Restore
  crypto: ^3.0.5 # Restore
  intl: ^0.20.2 # Match modern SDK
  qr_flutter: ^4.1.0
  flutter_localizations:
    sdk: flutter
  pocketbase: ^0.23.0+1
  open_filex: ^4.5.0
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1
  envied_generator: ^0.5.4+1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/ # 🚀 ADDED
    - assets/binaries/